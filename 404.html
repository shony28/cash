<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirect</title>
  <script>
const path = window.location.pathname;
const newUrl = "/?id=" + encodeURIComponent(path);
history.replaceState(null, "", path);
window.location.replace(newUrl);

  </script>
</head>
<body>

</body>
</html>
